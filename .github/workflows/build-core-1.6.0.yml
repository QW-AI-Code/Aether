name: Build Aether Mobile - Core 1.6.0 Custom

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      NDK_VERSION: "26.3.11579264"
      REQUIRED_CORE: "1.6.0"

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager "ndk;${NDK_VERSION}" >/dev/null
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Pin and sync official Aether Core 1.6.0
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AETHER_REPO: CluvexStudio/Aether
          CORE_TARGET: "1.6.0"
        run: |
          set -euo pipefail
          bash scripts/sync-core.sh

          CORE="$(tr -d '[:space:]' < native/aether/CORE_VERSION)"
          echo "Synced core: ${CORE}"

          if [ "${CORE}" != "${REQUIRED_CORE}" ]; then
            echo "::error::Expected Aether Core ${REQUIRED_CORE}, but got ${CORE}."
            exit 1
          fi

      - name: Fetch native sources
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/fetch-natives.sh

      - name: Build HEV tunnel and JNI bridge
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-natives.sh hev

      - name: Build Aether Core 1.6.0
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Deliberately NO rollback to 1.5.0.
          bash scripts/build-natives.sh aether

          CORE="$(tr -d '[:space:]' < native/aether/CORE_VERSION)"
          if [ "${CORE}" != "${REQUIRED_CORE}" ]; then
            echo "::error::Core changed unexpectedly to ${CORE}."
            exit 1
          fi

          test -f app/src/main/jniLibs/arm64-v8a/libaether.so
          test -f app/src/main/jniLibs/armeabi-v7a/libaether.so

      - name: Purge stale QW sources
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/purge-stale-sources.sh

      - name: Make custom side-by-side Android package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          old_app_id = 'applicationId = "studio.cluvex.aether"'
          new_app_id = 'applicationId = "studio.cluvex.aether.saman.core160"'

          if old_app_id not in s:
              raise SystemExit("Expected QW applicationId was not found.")

          # Change ONLY applicationId. Keep namespace studio.cluvex.aether
          # because the JNI bridge exports Java_studio_cluvex_aether_* symbols.
          s = s.replace(old_app_id, new_app_id, 1)

          m = re.search(r'(?m)^(\s*versionName\s*=\s*)"([^"]+)"', s)
          if not m:
              raise SystemExit("versionName was not found.")

          old_version = m.group(2)
          new_version = f"{old_version}-core1.6.0-custom"
          s = s[:m.start()] + f'{m.group(1)}"{new_version}"' + s[m.end():]

          p.write_text(s)
          print("Custom applicationId applied.")
          print("Version:", new_version)
          PY

      - name: Generate temporary custom signing key
        shell: bash
        run: |
          set -euo pipefail

          KS="${RUNNER_TEMP}/aether-core160-custom.jks"

          keytool -genkeypair -v \
            -keystore "$KS" \
            -storepass "aether-core160" \
            -keypass "aether-core160" \
            -alias "aether-core160" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10950 \
            -dname "CN=Aether Core 1.6.0 Custom, OU=Android, O=Saman Build"

          {
            echo "KEYSTORE_PATH=$KS"
            echo "KEYSTORE_PASSWORD=aether-core160"
            echo "KEY_ALIAS=aether-core160"
            echo "KEY_PASSWORD=aether-core160"
          } >> "$GITHUB_ENV"

      - name: Build signed release APKs
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APKs and native libraries
        shell: bash
        run: |
          set -euo pipefail

          BT="$(ls -d "${ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -n1)"
          mkdir -p artifacts

          found=0

          for apk in app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            found=1

            echo "=================================================="
            echo "Verifying: $apk"

            "${BT}/apksigner" verify --verbose --print-certs "$apk"

            entries="$(unzip -Z1 "$apk")"

            echo "$entries" | grep -q '/libaether\.so$' || {
              echo "::error::libaether.so missing from $apk"
              exit 1
            }

            echo "$entries" | grep -q '/libhev-socks5-tunnel\.so$' || {
              echo "::error::libhev-socks5-tunnel.so missing from $apk"
              exit 1
            }

            echo "$entries" | grep -q '/libaethertun\.so$' || {
              echo "::error::libaethertun.so missing from $apk"
              exit 1
            }

            base="$(basename "$apk" .apk)"
            out="artifacts/${base}-core1.6.0-custom.apk"
            cp "$apk" "$out"
          done

          if [ "$found" -ne 1 ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi

          printf '1.6.0\n' > artifacts/CORE_VERSION.txt
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt

          echo "Built APKs:"
          ls -lh artifacts
          cat artifacts/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Mobile-Core-1.6.0-Custom
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
