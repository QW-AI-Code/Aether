name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

# ONE build at a time. Two pushes in quick succession used to start two runs that
# both signed, both pushed commits back to the branch and both published to the
# same release tag. Now the newer push cancels the older run on a branch, while a
# tag build (v*) is never cancelled - it is a real release and has to finish.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  build:
    # Do not spend a full build + release on a dependency bump. Merging a
    # Dependabot PR is a push to main, which would otherwise publish an APK
    # nobody asked for. Such commits are skipped here; when you DO want to build
    # one, open Actions -> Build APK -> "Run workflow" and it builds normally.
    # A tag push (v*) is never skipped - pushing a version tag is always an
    # explicit release, whatever the commit it points at happens to be called.
    # (The workflow's own commits already carry [skip ci] and cannot retrigger it,
    # because they are pushed with the default GITHUB_TOKEN.)
    if: >-
      github.event_name != 'push'
      || github.ref_type != 'branch'
      || !(contains(github.event.head_commit.message, 'dependabot')
      || startsWith(github.event.head_commit.message, 'deps')
      || startsWith(github.event.head_commit.message, 'ci:'))
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "26.3.11579264"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # RELEASE TREE: the repository must hold exactly the uploaded release.
      #
      # A new version is published by uploading its files over the previous
      # one. That overwrites everything the release ships but can never delete
      # what it dropped (1.3.0 -> 1.4.0: the psiphontunnel AAR, its PROVENANCE
      # file and transport/PsiphonHealth.kt), and a leftover source or library
      # breaks the build or the app. scripts/enforce-release-tree.sh uses
      # SOURCE_MANIFEST.sha256 as the list of the release's files: it first
      # proves the upload is complete (every file present, every hash right -
      # otherwise it stops and deletes nothing), then removes every tracked file
      # that is not in the manifest, except CI-managed signing files and
      # workflows. It runs once per release (marker .github/release-tree.applied)
      # and FIRST, before any build step can see a stale file.
      - name: Enforce release tree (remove files from older versions)
        run: bash scripts/enforce-release-tree.sh

      # Record the cleanup on the branch, so the repository itself shows only the
      # new release. Best-effort: if the push fails the next build simply
      # enforces again (the marker was not pushed either).
      - name: Commit release-tree cleanup
        if: github.ref_type == 'branch'
        run: |
          set -uo pipefail
          if git diff --cached --quiet; then
            echo "Nothing to commit - the release tree was already exact."
            exit 0
          fi
          VERSION="$(sed -n 's/^version=//p' .github/release-tree.applied)"
          REMOVED="$(sed -n 's/^removed=//p' .github/release-tree.applied)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: keep only Aether ${VERSION} files (removed ${REMOVED} leftover file(s)) [skip ci]" || exit 0
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" \
            || echo "::warning::Could not push the release-tree cleanup; the next build will enforce it again."

      # 1.4.0: "No space left on device".
      #
      # A 1.4.0 build built, tested, signed and PUBLISHED all four APKs, and then the
      # job went red in its very last post-step: setup-gradle's "Caching Gradle
      # state" ran zstd into a full disk (`zstd: error 70 : Write error : cannot
      # write block : No space left on device`). The culprit is 1.4.0's build
      # volume: the Tor-enabled engine for three ABIs (~30 min of cargo, several GB
      # of target/), plus the Go builds of Psiphon and lyrebird, plus Gradle, on a
      # hosted runner that starts with only ~14 GB free. Two fixes, both needed:
      #   1. free the preinstalled toolchains this build never uses, up front;
      #   2. delete the native build intermediates once the .so files are
      #      installed in jniLibs (next step after the engine build), and again
      #      right before the post-job cache save.
      # Nothing removed here is used by any later step.
      - name: Free runner disk space
        run: |
          set -u
          echo "Before:"; df -h / | tail -1
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/.ghcup /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Ruby \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/julia* \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/lib/node_modules \
            /opt/microsoft /opt/google /opt/az \
            "${AGENT_TOOLSDIRECTORY:-/nonexistent}/CodeQL" || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "After:"; df -h / | tail -1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ROOT FIX (2026-09-15): this step - not anything in the repository - is
      # what killed the build 14 seconds in, before a single file of the
      # checkout was read:
      #
      #   [command] .../cmdline-tools/16.0/bin/sdkmanager tools
      #   Warning: Failed to find package 'tools'
      #   Error: The process '.../sdkmanager' failed with exit code 1
      #
      # android-actions/setup-android's `packages` input DEFAULTS to
      # "tools platform-tools", and the action hands those to sdkmanager one at
      # a time. `tools` is the retired SDK Tools package (superseded years ago
      # by cmdline-tools, which this same action installs through its own
      # cmdline-tools-version input). Google stopped serving `tools` from the
      # SDK repository, so sdkmanager cannot find it and exits 1, which the
      # action turns into a job failure. Every repository using the action with
      # no `packages` input broke at the same moment - which is why the same
      # commit built fine in a scratch repository a day earlier and dies here.
      #
      # So we never rely on that default again: state EXACTLY what this build
      # needs. That also removes the second dependency on luck - compileSdk 35
      # and the build-tools used by the apksigner step were only ever there
      # because the runner image happened to preinstall them, and the images
      # drop old platforms over time.
      #   platform-tools          - adb + the tooling Gradle expects to find
      #   platforms;android-35    - compileSdk = 35 / targetSdk = 35
      #   build-tools;35.0.0      - apksigner for "Verify release signature"
      # `tools` is deliberately absent and must never be added back.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      # 1.6.0 ships the complete, checksummed Gradle Wrapper. Pin the setup
      # action to the same 8.9 version for its cache/toolchain integration;
      # test and packaging tasks below run through ./gradlew, not runner defaults.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Show build toolchain
        run: |
          # GitHub web uploads may lose executable bits.
          chmod +x gradlew
          ./gradlew --version
          java -version 2>&1

      # ------------------------------------------------------------------ 1.3.1
      # Bump engine dependencies that carry a KNOWN advisory, within the semver
      # range their crate already allows.
      #
      # Sync replaces Cargo.lock. Reapply scoped fixes before fetching/compiling.
      # build-natives also checks the actual working crate, including rollback cores.
      # Fail closed if a required patch cannot be resolved; never ship a knowingly
      # vulnerable binary just because the registry was unavailable.
      - name: Test security CI handling
        run: |
          python3 scripts/test-security-ci.py
          python3 scripts/test-core-sync-disabled.py
          python3 scripts/test-functional-wiring.py
          python3 scripts/test-ai-settings-coverage.py
          python3 scripts/test-auto-signing.py
          python3 scripts/test-ci-preflight.py

      # Signing: ALWAYS sign with a STABLE key so users can update in place
      # (Android only installs an update when old and new APKs share the same
      # signature). Priority:
      #   1. Your own keystore from repo Secrets (recommended for real releases).
      #   2. A CI keystore persisted in the repo (.github/ci-keystore.jks.b64):
      #      generated ONCE on the first build and committed back automatically,
      #      so every later build reuses the exact same key. Without this, each
      #      build used a fresh debug key and users had to uninstall on every
      #      update.
      # NOTE: the repo-persisted CI keystore is public by definition. It solves
      # updatability, not authenticity - set the Secrets for real distribution.
      - name: Prepare signing keystore (stable across builds)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # AUTHORITATIVE KEY (this is the 1.2.1 release key). When the four
          # signing secrets are configured in the repository, the APK is signed
          # with EXACTLY the same certificate as 1.2.1, so 1.2.1 users can
          # install 1.2.2 straight over their existing app. Only in this mode
          # is the fingerprint pinned and enforced.
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "Using the user-provided release keystore from repository Secrets."
            echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.keystore"
            {
              echo "KEYSTORE_PATH=${RUNNER_TEMP}/release.keystore"
              echo "KEYSTORE_PASSWORD=${SECRET_KEYSTORE_PASSWORD}"
              echo "KEY_ALIAS=${SECRET_KEY_ALIAS}"
              echo "KEY_PASSWORD=${SECRET_KEY_PASSWORD}"
              echo "AETHER_SIGNING_MODE=release"
            } >> "$GITHUB_ENV"
            exit 0
          fi

          # PUBLIC TEST KEY. With no Secrets, reuse the bundled historical CI
          # key. Its fingerprint is still checked below; no key rotation and no
          # disabled signer guard. This needs no repository-settings changes.
          # It is public and provides test-build continuity, not authenticity.
          # An APK signed with a different private key will NOT accept this as
          # an in-place update. Private signing Secrets remain optional/preferred.
          echo "::warning::Using the bundled PUBLIC TEST certificate; no signing Secrets are required for this test build."
          echo "::warning::Use a private signing identity for authenticated production releases."
          echo "AETHER_SIGNING_MODE=test" >> "$GITHUB_ENV"

          KS="${RUNNER_TEMP}/ci-release.keystore"
          if [ -f .github/ci-keystore.jks.b64 ]; then
            echo "Reusing the persisted CI keystore (same signature as previous builds)."
            base64 -d .github/ci-keystore.jks.b64 > "$KS"
          else
            # OVER-INSTALL GUARD: if this repository has already published
            # releases signed with a persisted CI key, its fingerprint was
            # recorded in .github/expected-signer-ci.txt. Minting a brand new
            # key here would silently produce an APK that existing users can
            # NOT install over their current app, so stop instead.
            if [ -f .github/expected-signer-ci.txt ]; then
              echo "::error::.github/ci-keystore.jks.b64 is missing but this repo already published with a persisted CI key."
              echo "::error::Restore .github/ci-keystore.jks.b64 (it is the key that signed the previous release),"
              echo "::error::or add the KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets."
              echo "::error::Building now would produce an APK that users could not install over their current version."
              exit 1
            fi
            echo "First build: generating a CI keystore and persisting it to the repo."
            keytool -genkeypair -v -keystore "$KS" \
              -storepass aether-ci-keystore -keypass aether-ci-keystore \
              -alias aether-ci -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Aether Mobile CI, OU=AetherMobile, O=QW-AI-Code"
            base64 -w0 "$KS" > .github/ci-keystore.jks.b64
            if [ "${GITHUB_REF_TYPE}" = "branch" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add .github/ci-keystore.jks.b64
              git commit -m "ci: persist auto-generated signing keystore [skip ci]"
              # Another CI cleanup or concurrent push may have changed the
              # branch, so rebase before pushing instead of racing it.
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
              git push origin "HEAD:${GITHUB_REF_NAME}" \
                || echo "WARNING: could not push the keystore back; the next build may sign with a different key."
            else
              echo "WARNING: tag build without a persisted keystore - push to a branch first so the keystore gets committed."
            fi
          fi
          {
            echo "KEYSTORE_PATH=$KS"
            echo "KEYSTORE_PASSWORD=aether-ci-keystore"
            echo "KEY_ALIAS=aether-ci"
            echo "KEY_PASSWORD=aether-ci-keystore"
          } >> "$GITHUB_ENV"

      # ROOT FIX for "it builds in a fresh repo but fails in the real one":
      # copying 1.2.2 on top of a 1.2.1 checkout overwrites changed files but
      # cannot delete the files 1.2.2 REMOVED (the in-app updater, the location
      # picker, the forced-exit policy). Those orphans still reference symbols
      # and string resources that no longer exist, so compileReleaseKotlin died
      # with "Unresolved reference 'GITHUB_REPO' / 'update_available' / ...".
      # The build now deletes them itself (and hard-fails early on any other
      # stale string reference), so a leftover file can never break a release.
      - name: Purge stale sources from older versions
        run: bash scripts/purge-stale-sources.sh

      # Keep the repository itself clean, so the next build starts from a tree
      # that no longer contains the orphans. Best-effort: a failed push must
      # never fail a release.
      - name: Commit stale-source purge
        if: github.ref_type == 'branch'
        run: |
          set -uo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit - the tree was already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: remove files left over from older versions (git rm) [skip ci]" || exit 0
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" \
            || echo "WARNING: could not push the purge commit; the next build will purge again."

      # Fail fast: execute BOTH real JVM/Compose suites before NDK/Go/Rust
      # setup and native compilation. Signing is prepared first because Gradle
      # also configures release test resources. No tests are skipped or ignored.
      - name: Run unit tests
        env:
          AETHER_UI_ARTIFACTS: ${{ runner.temp }}/aether-validation/screenshots
          AETHER_REPAIR_ARTIFACTS: ${{ runner.temp }}/aether-validation/screenshots
          AETHER_TEST_REPORTS: ${{ runner.temp }}/aether-validation/test-reports
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"
        run: |
          set -uo pipefail
          LOG="${RUNNER_TEMP:-/tmp}/gradle-unit-tests.log"
          for attempt in 1 2 3; do
            set +e
            ./gradlew :app:testDebugUnitTest :app:testReleaseUnitTest --no-daemon --stacktrace 2>&1 | tee "$LOG"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if ! grep -qE 'Could not (resolve|GET|get resource|download)|Received status code (403|408|429|50[0-9])|Read timed out|Connection reset|Premature end of Content-Length' "$LOG"; then
              echo "::error::Unit tests FAILED. Refusing to build a release from code that does not pass its own tests."
              exit "$status"
            fi
            if [ "$attempt" -ge 3 ]; then
              echo "::error::Dependency download kept failing after 3 attempts."
              exit "$status"
            fi
            echo "::warning::Attempt ${attempt} failed while downloading dependencies - retrying in $((attempt * 30))s."
            sleep $((attempt * 30))
          done

      # This step swallowed sdkmanager's output into /dev/null, so a package that
      # is no longer served would fail here with nothing to read. Keep the log,
      # and prove the NDK is on disk before exporting a path later steps use.
      #
      # DO NOT ADD `set -o pipefail` HERE, AND DO NOT PIPE INTO sdkmanager.
      # Both were tried and both fail a build in which nothing is wrong:
      # `yes | sdkmanager ...` ends with sdkmanager exiting first and `yes`
      # getting EPIPE on its next write, so it prints "yes: standard output:
      # Broken pipe" and exits non-zero. Without pipefail that status is
      # discarded (only sdkmanager's counts, which is why the original line
      # worked); with pipefail it becomes the step's exit code and the job dies
      # AFTER the NDK was downloaded and unzipped successfully - exactly what
      # happened in run 94592578298. The pipe is not needed at all: the SDK
      # licences were already accepted by the previous step
      # (accept-android-sdk-licenses), so sdkmanager does not prompt. Redirecting
      # </dev/null makes that explicit and cannot break.
      - name: Install NDK
        run: |
          set -eu
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK root is not set}}"
          sdkmanager --install "ndk;${NDK_VERSION}" </dev/null
          if [ ! -d "${SDK}/ndk/${NDK_VERSION}" ]; then
            echo "::error::NDK ${NDK_VERSION} was not installed at ${SDK}/ndk/${NDK_VERSION}."
            echo "NDKs present:"
            ls -1 "${SDK}/ndk" 2>/dev/null || echo "  (none)"
            exit 1
          fi
          echo "ANDROID_NDK_HOME=${SDK}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # Fail here, with a readable message, rather than three steps later inside
      # a Gradle stacktrace or with `ls -d .../build-tools/*` expanding to a
      # literal glob in the signature check. Written without pipefail and
      # without `set -e` aborting a check mid-way, so every failure path here
      # prints WHY it failed instead of ending the step silently.
      - name: Verify Android SDK layout
        run: |
          set -u
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          echo "ANDROID_SDK_ROOT=${SDK}"
          rc=0
          for d in "platforms/android-35" "platform-tools" "ndk/${NDK_VERSION}"; do
            if [ -d "${SDK}/${d}" ]; then
              echo "  ok: ${d}"
            else
              echo "::error::missing SDK component: ${d}"
              rc=1
            fi
          done
          BT=""
          for d in "${SDK}"/build-tools/*/; do
            [ -x "${d}apksigner" ] && BT="$d"
          done
          if [ -n "$BT" ]; then
            echo "  ok: build-tools with apksigner -> ${BT}"
          else
            echo "::error::no build-tools containing apksigner under ${SDK}/build-tools"
            rc=1
          fi
          exit "$rc"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Rust (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # AUTOMATIC CORE UPDATES ARE DISABLED (1.6.0, same version).
      #
      # The vendored engine in native/aether (core 2.4.0, see CORE_VERSION) is
      # the ONLY engine this build compiles. CI no longer asks GitHub for a newer
      # CluvexStudio/Aether release, never swaps the vendored sources and never
      # commits an engine upgrade back to the branch. A core upgrade is a
      # deliberate, reviewed change to native/aether made by hand (with its UI),
      # not something a workflow may do on its own. scripts/test-core-sync-disabled.py
      # fails the build if any of that comes back.

      - name: Patch known-vulnerable engine dependencies
        run: python3 scripts/patch-engine-dependencies.py native/aether/aether

      - name: Fetch native sources
        run: bash scripts/fetch-natives.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build tunnel core (hev)
        run: bash scripts/build-natives.sh hev

      # Tor bridges only. Deliberately NOT allowed to fail the release: Tor works
      # without it (directly and through the tunnel), so a lyrebird build broken
      # by an upstream Go change must not hold back an APK in which everything
      # else is fine. The app logs the absence at connect time.
      - name: Build pluggable transport (lyrebird, for Tor bridges)
        continue-on-error: true
        run: bash scripts/build-natives.sh pt

      # 1.4.0: Psiphon lives in the engine (core 2.1.0). The engine runs the
      # psiphon-tunnel-core console client; on Android it ships as libpsiphon.so.
      # NOT allowed to fail: both Psiphon modes need it.
      - name: Build Psiphon (the engine's console client)
        run: bash scripts/build-natives.sh psiphon

      # 1.5.0: custom configs (V2Ray/Xray links, Xray JSON, NapsternetV .npvt)
      # run in Xray-core, shipped as libxray.so. Official XTLS release binaries
      # at a pinned version, verified against pinned SHA-256 sums (see
      # build_xray in build-natives.sh). NOT allowed to fail: without it every
      # custom-config chain would fail at connect time.
      - name: Fetch Xray core (custom configs)
        run: bash scripts/build-natives.sh xray

      # 1.3.0: builds with `--features tor` (see AETHER_FEATURES in
      # build-natives.sh) and refuses to install an engine that has no Tor in it.
      # There is no rollback path any more: the engine is vendored and never
      # auto-upgraded, so a failure here is always a real build error.
      - name: Build engine (Aether, with Tor)
        run: bash scripts/build-natives.sh aether
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 1.4.0: every native .so is now in app/src/main/jniLibs. The Rust
      # target/ tree (several GB for three ABIs with Tor) and the Go build/module
      # caches are dead weight from here on, and they are what filled the disk
      # before the post-job Gradle cache save. Sources are kept: Gradle and the
      # commit step below still read them.
      - name: Reclaim disk space (native build intermediates)
        if: always()
        run: |
          set -u
          echo "Before:"; df -h / | tail -1
          rm -rf .native/aether/target native/aether/target 2>/dev/null || true
          go clean -cache -modcache 2>/dev/null || true
          rm -rf "${HOME}/.cargo/registry/src" "${HOME}/.cache/go-build" 2>/dev/null || true
          echo "After:"; df -h / | tail -1

      # A release must never die because an artifact repository had a bad
      # minute. The 1.2.6 build in the release repository failed with
      # "Received status code 403 from server: Forbidden" from Maven Central on
      # EVERY buildscript dependency, so the root project could not even be
      # configured. settings.gradle.kts now has a mirror to fall through to,
      # and this step retries a failure that is clearly a download problem
      # (403/408/429/5xx, timeouts, "Could not resolve"). A real build error is
      # never retried, so a genuine compile failure still fails fast.
      # 1.2.7 removed the Tor backend, so there is no native Tor core to build
      # here any more (scripts/build-tor.sh is gone with it). The Aether core and
      # libpsiphon.so (1.4.0, replacing the Psiphon AAR) are the native inputs.
      # 1.2.9-r3: RUN THE TESTS. The 1.2.9 crash (AiRedaction "No group 1", which
      # killed the app a minute after every connect) shipped past eight unit tests
      # that would all have failed on it, because nothing ever executed them. The
      # redaction rules and the new LAN-sharing access rules (LanGuardTest) are pure
      # Kotlin by design precisely so this step can be cheap and mandatory.
      #
      # Retried on the same download-failure signatures as the build below, so an
      # artifact repository having a bad minute cannot fail a release here either. A
      # genuine test failure is never retried.
      # DEPENDENCY-VULNERABILITY SCAN (audit 1.3.0, F-7).
      #
      # Audit the successful build's captured lock, not an independently updated
      # source lock. This remains accurate after an automatic core rollback.
      #
      # Capture cargo-audit's finding exit code without Bash -e aborting the
      # report. Maintenance warnings remain visible; vulnerabilities block release.
      # Installation, network and malformed-report failures are NOT a clean scan.
      - name: Audit Rust dependencies (cargo audit)
        run: |
          set -euo pipefail
          cargo install --locked cargo-audit --version 0.22.2
          python3 scripts/audit-rust.py --strict \
            --crate "${RUNNER_TEMP}/aether-audit/built-engine" \
            --report "${RUNNER_TEMP}/aether-audit/cargo-audit.json"

      - name: Upload Rust audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-dependency-audit
          path: ${{ runner.temp }}/aether-audit/
          if-no-files-found: warn

      # Retain the post-native gate as well: core sync may change build
      # identity/source inputs. Force the Test tasks (not all compile tasks)
      # to execute again before packaging; never trust an early cached result.
      - name: Revalidate unit tests against built core
        env:
          AETHER_UI_ARTIFACTS: ${{ runner.temp }}/aether-validation/screenshots
          AETHER_REPAIR_ARTIFACTS: ${{ runner.temp }}/aether-validation/screenshots
          AETHER_TEST_REPORTS: ${{ runner.temp }}/aether-validation/test-reports
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"
        run: |
          set -uo pipefail
          LOG="${RUNNER_TEMP:-/tmp}/gradle-unit-tests-final.log"
          for attempt in 1 2 3; do
            set +e
            ./gradlew :app:testDebugUnitTest --rerun :app:testReleaseUnitTest --rerun --no-daemon --stacktrace 2>&1 | tee "$LOG"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if ! grep -qE 'Could not (resolve|GET|get resource|download)|Received status code (403|408|429|50[0-9])|Read timed out|Connection reset|Premature end of Content-Length' "$LOG"; then
              echo "::error::Unit tests FAILED. Refusing to build a release from code that does not pass its own tests."
              exit "$status"
            fi
            if [ "$attempt" -ge 3 ]; then
              echo "::error::Dependency download kept failing after 3 attempts."
              exit "$status"
            fi
            echo "::warning::Attempt ${attempt} failed while downloading dependencies - retrying in $((attempt * 30))s."
            sleep $((attempt * 30))
          done


      - name: Build release APKs
        env:
          # Kotlin/Compose compilation needs more heap than the 1 GB Gradle
          # default on the hosted runners.
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"
        run: |
          set -uo pipefail
          LOG="${RUNNER_TEMP:-/tmp}/gradle-release-build.log"
          for attempt in 1 2 3; do
            set +e
            ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee "$LOG"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if ! grep -qE 'Could not (resolve|GET|get resource|download)|Received status code (403|408|429|50[0-9])|Read timed out|Connection reset|Premature end of Content-Length' "$LOG"; then
              echo "::error::Release build failed for a reason that is NOT an artifact download problem - not retrying."
              exit "$status"
            fi
            if [ "$attempt" -ge 3 ]; then
              echo "::error::Dependency download kept failing after 3 attempts (Maven Central / plugin portal unreachable or blocking this runner)."
              exit "$status"
            fi
            echo "::warning::Attempt ${attempt} failed while downloading dependencies - retrying in $((attempt * 30))s."
            sleep $((attempt * 30))
          done

      # PLAY-PROTECT SAFEGUARD: never publish an APK that is unsigned or
      # debug-signed. Throwaway debug certificates (a different one on every
      # machine/runner) are exactly what makes Google show "Play Protect
      # hasn't seen an app from this developer before" on install. Also
      # require the modern v2 signature scheme on every APK.
      - name: Verify release signature (Play Protect safeguard)
        run: |
          set -euo pipefail
          BT="$(ls -d "${ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -n1)"
          found=0
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            found=1
            "${BT}/apksigner" verify --verbose --print-certs "$apk" > /tmp/sig.txt
            grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/sig.txt \
              || { echo "ERROR: $apk lacks an APK Signature Scheme v2 signature"; exit 1; }
            if grep -qi "CN=Android Debug" /tmp/sig.txt; then
              echo "ERROR: $apk is signed with a DEBUG certificate — refusing to publish"; exit 1
            fi

            # 1.2.2 OVER-INSTALL GUARANTEE: Android refuses to update an
            # installed app when the new APK is signed by a different
            # certificate (INSTALL_FAILED_UPDATE_INCOMPATIBLE), which is what
            # forced 1.2.1 users to uninstall first and lose their settings.
            # We pin the expected signer fingerprint: if a build ever produces
            # a different certificate than the one 1.2.1 shipped with, the
            # build FAILS here instead of shipping an APK users cannot install
            # on top of their current version.
            # Robust fingerprint extraction. The previous pattern required an
            # exact "Signer #1 certificate SHA-256 digest: " prefix and matched
            # nothing on this runner, so an EMPTY fingerprint was pinned and the
            # whole over-install guarantee silently became a no-op. Now we grab
            # the first 64-hex digest on any SHA-256 line, fall back to keytool,
            # and HARD FAIL if we still cannot determine it.
            SHA="$(tr -d '\r' < /tmp/sig.txt \
              | sed -n 's/.*SHA-256 digest:[[:space:]]*\([0-9a-fA-F]\{64\}\).*/\1/p' \
              | head -n1 | tr 'A-F' 'a-f')"
            if [ -z "$SHA" ]; then
              SHA="$(keytool -printcert -jarfile "$apk" 2>/dev/null \
                | tr -d '\r' \
                | sed -n 's/.*SHA-?256:[[:space:]]*\([0-9A-Fa-f:]\{95,\}\).*/\1/p' \
                | head -n1 | tr -d ':' | tr 'A-F' 'a-f')"
            fi
            if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "ERROR: could not extract the signer SHA-256 fingerprint from $apk."
              echo "Refusing to continue: an empty fingerprint would disable the"
              echo "over-install protection that keeps users from having to uninstall."
              sed -n '1,40p' /tmp/sig.txt
              exit 1
            fi
            echo "Signer SHA-256: ${SHA}"
            # Published in the release body (see "Collect and rename APKs").
            echo "SIGNER_SHA256=${SHA}" >> "$GITHUB_ENV"
            # In TEST signing mode the certificate is a throwaway one, so it is
            # meaningless to compare or record it. We only report it.
            if [ "${AETHER_SIGNING_MODE:-test}" != "release" ]; then
              # The CI key is a throwaway one, but it is the SAME throwaway key
              # on every build of this repository (it lives in
              # .github/ci-keystore.jks.b64), and 1.2.1 was published with it.
              # So its fingerprint still decides whether users can update in
              # place. Pin it PER REPOSITORY: if it ever changes, fail here
              # instead of publishing an APK that cannot be installed over the
              # previous version. A scratch repository pins its own value and
              # can never affect the real one.
              if [ -f .github/expected-signer-ci.txt ] \
                 && grep -Eq '^[0-9a-fA-F]{64}$' .github/expected-signer-ci.txt; then
                EXPECTED_CI="$(grep -Eo '^[0-9a-fA-F]{64}$' .github/expected-signer-ci.txt | tr 'A-F' 'a-f' | head -n1)"
                if [ "$EXPECTED_CI" != "$SHA" ]; then
                  echo "ERROR: the CI signing certificate changed!"
                  echo "  expected: ${EXPECTED_CI}"
                  echo "  actual:   ${SHA}"
                  echo "Users of the previous release could NOT install this update over it."
                  echo "Restore .github/ci-keystore.jks.b64 from the previous release commit."
                  exit 1
                fi
                echo "CI signer matches the previous release - users can update in place."
              else
                echo "${SHA}" > /tmp/expected-signer-ci.txt
                echo "NOTE: recording this CI signer fingerprint for future builds."
              fi
              echo "Signature OK (test key): $apk"
              continue
            fi

            if [ -f .github/expected-signer.txt ] \
               && grep -Eq '^[0-9a-fA-F]{64}$' .github/expected-signer.txt; then
              EXPECTED="$(grep -Eo '^[0-9a-fA-F]{64}$' .github/expected-signer.txt | tr 'A-F' 'a-f' | head -n1)"
              if [ -n "$EXPECTED" ] && [ "$EXPECTED" != "$SHA" ]; then
                echo "ERROR: signer certificate changed!"
                echo "  expected: ${EXPECTED}"
                echo "  actual:   ${SHA}"
                echo "Users could NOT over-install on top of 1.2.1. Refusing to publish."
                exit 1
              fi
              echo "Signer matches the pinned certificate - 1.2.1 users can over-install."
            else
              echo "${SHA}" > /tmp/expected-signer.txt
              echo "NOTE: no pinned signer yet; recording this fingerprint."
            fi
            echo "Signature OK: $apk"
          done
          [ "$found" -eq 1 ] || { echo "ERROR: no release APKs found to verify"; exit 1; }

      # Persist the signer fingerprint on the first build so every later build
      # is checked against it automatically.
      - name: Pin signer fingerprint (first build only)
        if: github.ref_type == 'branch'
        run: |
          set -euo pipefail
          [ -f /tmp/expected-signer.txt ] || exit 0
          # Only the REAL release key (from repository Secrets) may ever be
          # pinned. A throwaway CI/test certificate must never be written into
          # the repository, otherwise building this project in a scratch
          # repository would break the over-install guarantee of the real
          # 1.2.1 release repository later on.
          if [ "${AETHER_SIGNING_MODE:-test}" != "release" ]; then
            echo "TEST signing mode: not pinning a throwaway certificate."
            exit 0
          fi
          # A previous build committed an EMPTY fingerprint file, which made the
          # pin check pass unconditionally. Treat a file without a valid 64-hex
          # value as "not pinned yet" and rewrite it.
          if [ -f .github/expected-signer.txt ] \
             && grep -Eq '^[0-9a-fA-F]{64}$' .github/expected-signer.txt; then
            exit 0
          fi
          {
            echo "# SHA-256 of the certificate that signs every Aether release."
            echo "# Recorded automatically on the first 1.2.2 build. Do not edit by hand:"
            echo "# if this value changes, users of 1.2.1 can no longer install an update"
            echo "# over their current app (they would have to uninstall and lose settings)."
            cat /tmp/expected-signer.txt
          } > .github/expected-signer.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/expected-signer.txt
          git commit -m "ci: pin release signer fingerprint for over-install compatibility [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" \
            || echo "WARNING: could not push the pinned signer fingerprint."

      # Persist the CI signer fingerprint (test-signing mode) so every later
      # build of THIS repository is checked against the certificate the
      # previous release was signed with.
      - name: Pin CI signer fingerprint
        if: github.ref_type == 'branch'
        run: |
          set -euo pipefail
          [ -f /tmp/expected-signer-ci.txt ] || exit 0
          if [ -f .github/expected-signer-ci.txt ] \
             && grep -Eq '^[0-9a-fA-F]{64}$' .github/expected-signer-ci.txt; then
            exit 0
          fi
          {
            echo "# SHA-256 of the CI certificate that signs this repository's APKs."
            echo "# Recorded automatically. If this value ever changes, users cannot"
            echo "# install a new release over the one they already have, so the build"
            echo "# fails instead of publishing such an APK."
            cat /tmp/expected-signer-ci.txt
          } > .github/expected-signer-ci.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/expected-signer-ci.txt
          git commit -m "ci: pin CI signer fingerprint for over-install compatibility [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" \
            || echo "WARNING: could not push the pinned CI signer fingerprint."

      # Do not publish an APK that can only run proxy mode. Full VPN mode needs
      # both native cores for every ABI contained in that APK.
      - name: Verify native libraries inside APKs
        run: |
          set -euo pipefail
          # 1.2.8-r5: the engine inside each APK must carry this revision's stamp.
          PATCH_LEVEL="$(tr -d '[:space:]' < PATCHLEVEL)"
          [ -n "$PATCH_LEVEL" ] || { echo "ERROR: PATCHLEVEL is empty"; exit 1; }
          echo "Expecting engine build stamp: AETHER-BUILD-STAMP:${PATCH_LEVEL}"
          found=0
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            found=1
            entries="$(unzip -Z1 "$apk")"
            mapfile -t abis < <(printf '%s\n' "$entries" | sed -n 's#^lib/\([^/]*\)/libaether\.so$#\1#p')
            [ "${#abis[@]}" -gt 0 ] || { echo "ERROR: no libaether.so in $apk"; exit 1; }
            for abi in "${abis[@]}"; do
              # NOT `printf ... | grep -qx`: this step runs under `set -o pipefail`,
              # and `grep -q` exits the moment it matches. When the APK's entry
              # list is larger than the 64 KiB pipe buffer (a release APK easily
              # is) printf is still writing, gets EPIPE, and the pipeline returns
              # 141 - so the check FAILS while the library it looked for is
              # present. Measured: 162 KB list, match near the front -> exit 141.
              # It only ever passed because the match happened to sit late enough
              # in the listing. A here-string has no pipe and cannot do this.
              grep -qx -- "lib/${abi}/libhev-socks5-tunnel.so" <<< "$entries" \
                || { echo "ERROR: $apk lacks hev for $abi"; exit 1; }
              grep -qx -- "lib/${abi}/libaethertun.so" <<< "$entries" \
                || { echo "ERROR: $apk lacks the aethertun JNI bridge for $abi"; exit 1; }
              grep -qx -- "lib/${abi}/libpsiphon.so" <<< "$entries" \
                || { echo "ERROR: $apk lacks libpsiphon.so for $abi (Psiphon modes would not work)"; exit 1; }
              grep -qx -- "lib/${abi}/libxray.so" <<< "$entries" \
                || { echo "ERROR: $apk lacks libxray.so for $abi (custom configs would not work)"; exit 1; }
              # ---------------------------------------------------------- r5
              # THE GATE THAT WOULD HAVE SAVED THE r4 ROUND.
              # The engine inside the APK must carry THIS revision's build
              # stamp. A stale libaether.so - from a cached jniLibs dir, a
              # reverted core-sync, or a build.rs that did not run - is caught
              # here, before the release exists, instead of costing a week of
              # field testing on a binary nobody can identify.
              unzip -p "$apk" "lib/${abi}/libaether.so" > /tmp/libaether-check.so
              if ! grep -qa -- "AETHER-BUILD-STAMP:${PATCH_LEVEL}" /tmp/libaether-check.so; then
                echo "ERROR: $apk ships an engine that is NOT patch level ${PATCH_LEVEL} ($abi)."
                echo "Stamps found inside the shipped libaether.so:"
                grep -ao 'AETHER-BUILD-STAMP:[0-9A-Za-z.\-]*' /tmp/libaether-check.so | sort -u || echo "  (none at all)"
                exit 1
              fi
              echo "  $abi engine stamp OK: AETHER-BUILD-STAMP:${PATCH_LEVEL}"
              # ------------------------------------------------------- 1.5.0
              # THE GATE THAT WOULD HAVE SAVED THE FIRST 1.5.0 BUILD.
              # Core 2.3.0 (boring 5.2) links libc++_shared.so; the APK did not
              # carry it and Android refused to start the engine in all six
              # modes. Every DT_NEEDED of the shipped engine must be an Android
              # system library or sit beside it in the same lib/<abi>/ folder.
              READELF="$(ls "${ANDROID_NDK_HOME:-/nonexistent}"/toolchains/llvm/prebuilt/*/bin/llvm-readelf 2>/dev/null | head -n1 || true)"
              [ -n "$READELF" ] || READELF="$(command -v readelf || true)"
              [ -n "$READELF" ] || { echo "ERROR: no readelf to check engine dependencies"; exit 1; }
              needed="$("$READELF" -d /tmp/libaether-check.so | sed -n 's/.*Shared library: \[\([^]]*\)\].*/\1/p')"
              [ -n "$needed" ] || { echo "ERROR: could not read the engine's dynamic section ($abi)"; exit 1; }
              while IFS= read -r dep; do
                [ -n "$dep" ] || continue
                case "$dep" in
                  libc.so|libdl.so|liblog.so|libm.so|libandroid.so|libz.so) ;;
                  *)
                    grep -qx -- "lib/${abi}/${dep}" <<< "$entries" \
                      || { echo "ERROR: $apk: libaether.so ($abi) needs $dep, which the APK does not contain."; \
                           echo "       The engine would die with CANNOT LINK EXECUTABLE in every mode."; exit 1; }
                    echo "  $abi engine dependency packaged: $dep"
                    ;;
                esac
              done <<< "$needed"
              rm -f /tmp/libaether-check.so
            done
            echo "Verified native cores in $apk (${abis[*]})"
          done
          [ "$found" -eq 1 ] || { echo "ERROR: no release APKs found"; exit 1; }

      - name: Collect and rename APKs
        run: |
          set -euo pipefail
          # Match the assignment specifically: a stray comment mentioning
          # "versionName" must not be able to rename every published artifact.
          VERSION_NAME="$(grep -m1 -E '^[[:space:]]*versionName[[:space:]]*=' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          [ -n "$VERSION_NAME" ] || { echo "ERROR: could not read versionName"; exit 1; }
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          OUT=artifacts
          mkdir -p "$OUT"
          declare -A MAP=(
            ["arm64-v8a"]="arm64-v8a"
            ["armeabi-v7a"]="armeabi-v7a"
            ["x86_64"]="x86_64"
            ["universal"]="universal"
          )
          for key in "${!MAP[@]}"; do
            src="$(find app/build/outputs/apk/release -iname "*${key}*.apk" | head -n1)"
            if [ -n "$src" ]; then
              cp "$src" "${OUT}/Aether-${VERSION_NAME}-${MAP[$key]}.apk"
            fi
          done
          echo "Built APKs:"
          ls -la "$OUT"

          # ---------------------------------------------------------------- F-1
          # The release signing key is committed to this repository, so a
          # signature alone does not prove where an APK came from, and rotating
          # the key would break in-place updates for every existing user. The
          # compensating control is out-of-band verifiability: publish the exact
          # SHA-256 of every artifact and the fingerprint of the certificate that
          # signed it. The app shows both (About card, via SignerIdentity), so a
          # user can compare what they installed with what this pipeline built.
          BODY="${RUNNER_TEMP:-/tmp}/release-body.md"
          cp .github/release-notes.md "$BODY"
          {
            echo
            echo "## Verify your download"
            echo
            echo "Open **About** in the app: it shows the APK SHA-256 and the signing certificate. They must match this list."
            echo
            echo '| File | SHA-256 |'
            echo '| --- | --- |'
            for f in "$OUT"/*.apk; do
              [ -f "$f" ] || continue
              echo "| \`$(basename "$f")\` | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"
            done
            echo
            if [ -n "${SIGNER_SHA256:-}" ]; then
              echo "Signing certificate SHA-256: \`${SIGNER_SHA256}\`"
            fi
          } >> "$BODY"
          echo "RELEASE_BODY=${BODY}" >> "$GITHUB_ENV"

      # Publish a Release on every successful build: each APK shows up as its
      # own downloadable asset. The release TITLE is just "Aether vX.Y.Z"
      # (no "(build N)" suffix); the tag still embeds the run number so every
      # build gets a unique tag. The "What's new" body comes from
      # .github/release-notes.md - update that file whenever the version changes.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}-build.{1}', env.VERSION_NAME, github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Aether {0}', github.ref_name) || format('Aether v{0}', env.VERSION_NAME) }}
          files: artifacts/*.apk
          make_latest: true
          body_path: ${{ env.RELEASE_BODY }}

      # 1.4.0: last step before the post-job hooks. setup-gradle packs the
      # Gradle home into a zstd archive AFTER this step, and in an earlier 1.4.0 build that archive
      # is what hit "No space left on device". The APKs are already in
      # artifacts/ and published, so the Android build intermediates can go.
      - name: Reclaim disk space before the Gradle cache save
        if: always()
        run: |
          set -u
          rm -rf app/build/intermediates app/build/tmp app/build/kotlin \
                 .native/aether/target "${HOME}/.cargo/registry/src" 2>/dev/null || true
          go clean -cache 2>/dev/null || true
          df -h / | tail -1

      - name: Package validation evidence
        if: always()
        run: |
          mkdir -p "${RUNNER_TEMP}/aether-validation/logs"
          for log in gradle-unit-tests.log gradle-unit-tests-final.log gradle-release-build.log; do
            if [ -f "${RUNNER_TEMP}/$log" ]; then
              cp "${RUNNER_TEMP}/$log" "${RUNNER_TEMP}/aether-validation/logs/"
            fi
          done
          cd "${RUNNER_TEMP}"
          zip -rq Validation_Evidence.zip aether-validation

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Validation-Evidence-1.6.0
          path: ${{ runner.temp }}/Validation_Evidence.zip
          if-no-files-found: warn

